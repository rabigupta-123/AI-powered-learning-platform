<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-Powered Personalized Learning Platform</title>
  
  <!-- Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React 18, ReactDOM, Babel for browser execution without native Node dependencies -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Precompiled bundle: in-browser Babel removed for maximum efficiency -->

  <style>
    :root {
      --accent-cyan: #38BDF8;
      --accent-amber: #FBBF24;
      --accent-emerald: #34D399;
      --accent-rose: #FB7185;
      
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Dark Mode (Default) */
    body.theme-dark {
      --bg-primary: #0A0E27;
      --bg-secondary: #140B2E;
      --page-bg: radial-gradient(circle at 15% 20%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                         radial-gradient(circle at 85% 30%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                         radial-gradient(circle at 50% 85%, rgba(14, 165, 233, 0.15) 0%, transparent 45%),
                         linear-gradient(135deg, #0A0E27 0%, #140B2E 100%);
      --glass-fill: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-blur: blur(20px);
      --glass-radius: 16px;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-inner: rgba(255, 255, 255, 0.02);
      --input-bg: rgba(255, 255, 255, 0.06);
      --hover-bg: rgba(255, 255, 255, 0.08);
    }

    /* Light Mode */
    body.theme-light {
      --bg-primary: #F8FAFC;
      --bg-secondary: #F1F5F9;
      --page-bg: #F8FAFC;
      --glass-fill: rgba(15, 23, 42, 0.03);
      --glass-border: rgba(15, 23, 42, 0.08);
      --glass-blur: blur(12px);
      --glass-radius: 16px;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --card-bg: #FFFFFF;
      --card-inner: #F8FAFC;
      --input-bg: #F1F5F9;
      --hover-bg: rgba(15, 23, 42, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-ui);
      background: var(--page-bg);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .mono-num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .app-layout { display: flex; min-height: 100vh; }

    /* Glass Sidebar */
    .sidebar {
      width: 270px;
      background: var(--glass-fill);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-right: 1px solid var(--glass-border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 20;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 20px 8px;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 18px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0EA5E9, #6366F1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: #fff;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
    }

    .brand-text h1 {
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .brand-text span {
      font-size: 0.70rem;
      color: var(--accent-cyan);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-secondary);
      transition: var(--transition);
      user-select: none;
    }

    .nav-item:hover {
      background: var(--hover-bg);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--hover-bg);
      color: var(--accent-cyan);
      border-left: 3px solid var(--accent-cyan);
      font-weight: 600;
    }

    .nav-badge {
      margin-left: auto;
      font-size: 0.70rem;
      padding: 2px 7px;
      border-radius: 20px;
      background: var(--glass-border);
      font-family: var(--font-mono);
    }

    .learner-card {
      padding: 12px 14px;
      background: var(--card-inner);
      border-radius: 12px;
      border: 1px solid var(--glass-border);
    }

    /* Content Area */
    .content {
      flex: 1;
      padding: 30px 36px 60px 36px;
      max-width: 1400px;
      margin: 0 auto;
      overflow-y: auto;
    }

    /* Topbar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--glass-border);
    }

    .topbar-title h2 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .topbar-title p {
      font-size: 0.86rem;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: var(--glass-fill);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      color: var(--text-primary);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: var(--transition);
    }

    .theme-toggle-btn:hover {
      background: var(--hover-bg);
      border-color: var(--accent-cyan);
    }

    .role-select-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: var(--glass-fill);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      font-size: 0.82rem;
      color: var(--text-primary);
    }

    .role-select-pill select {
      background: transparent;
      border: none;
      color: var(--accent-cyan);
      font-weight: 700;
      font-size: 0.84rem;
      outline: none;
      cursor: pointer;
    }

    /* 4 Header Stat Cards */
    .stat-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 26px;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--glass-radius);
      padding: 20px;
      position: relative;
    }

    .stat-card-title {
      font-size: 0.80rem;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .stat-card-val {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1.1;
      color: var(--text-primary);
    }

    .stat-card-sub {
      font-size: 0.78rem;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .charts-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 18px;
      margin-bottom: 26px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @keyframes pulseRemediation {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(251, 113, 133, 0.6); }
      50% { transform: scale(1.04); box-shadow: 0 0 0 8px rgba(251, 113, 133, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(251, 113, 133, 0); }
    }

    .pulse-once {
      animation: pulseRemediation 1.6s ease-out 1;
    }

    .mastery-bar-fill {
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(90deg, #38BDF8, #34D399);
      transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .table-container {
      overflow-x: auto;
      margin-top: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-secondary);
      padding: 11px 14px;
      border-bottom: 1px solid var(--glass-border);
      letter-spacing: 0.05em;
    }

    td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--glass-border);
      font-size: 0.86rem;
    }

    tr:last-child td { border-bottom: none; }

    .status-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    .pill-active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .pill-remediation {
      background: rgba(251, 113, 133, 0.15);
      color: var(--accent-rose);
      border: 1px solid rgba(251, 113, 133, 0.4);
    }

    .pill-completed {
      background: rgba(52, 211, 153, 0.15);
      color: var(--accent-emerald);
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .assess-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 12px;
    }

    .form-control {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-control label {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-control select,
    .form-control input {
      padding: 8px 11px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.86rem;
      outline: none;
    }

    .form-control select:focus,
    .form-control input:focus { border-color: var(--accent-cyan); }

    .btn-submit {
      padding: 9px 18px;
      background: linear-gradient(135deg, #0284C7, #2563EB);
      color: #fff;
      font-weight: 700;
      font-size: 0.86rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }

    .btn-submit:hover { filter: brightness(1.1); }

    .btn-action-small {
      padding: 5px 12px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-cyan);
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-action-small:hover {
      background: rgba(56, 189, 248, 0.22);
    }

    /* Floating Chatbot Widget */
    .floating-chat {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
    }

    .chat-bubble-btn {
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background: linear-gradient(135deg, #0EA5E9, #6366F1);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.4);
      border: none;
      transition: var(--transition);
    }

    .chat-bubble-btn:hover { transform: scale(1.06); }

    .chat-window {
      position: absolute;
      bottom: 70px;
      right: 0;
      width: 380px;
      height: 520px;
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .chat-header {
      padding: 13px 16px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-inner);
    }

    .chat-body {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .chat-msg {
      max-width: 85%;
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 0.84rem;
      line-height: 1.45;
    }

    .msg-user {
      align-self: flex-end;
      background: linear-gradient(135deg, #0284C7, #2563EB);
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .msg-assistant {
      align-self: flex-start;
      background: var(--card-inner);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      border-bottom-left-radius: 3px;
    }

    .chat-footer {
      padding: 11px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      gap: 8px;
      background: var(--card-inner);
    }

    .chat-input {
      flex: 1;
      padding: 8px 11px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
    }

    .chat-send-btn {
      padding: 7px 13px;
      background: var(--accent-cyan);
      color: #0A0E27;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    /* Settings Panel */
    .settings-panel {
      display: flex;
      flex-direction: column;
      gap: 22px;
      max-width: 720px;
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--glass-border);
    }

    .api-key-box {
      background: var(--card-inner);
      border: 1px solid var(--glass-border);
      padding: 18px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .filter-pill {
      padding: 6px 14px;
      border-radius: 16px;
      background: var(--card-inner);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      font-size: 0.80rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-pill.active {
      background: var(--accent-cyan);
      color: #0A0E27;
      border-color: var(--accent-cyan);
    }

    @media (max-width: 1024px) {
      .stat-row { grid-template-columns: repeat(2, 1fr); }
      .charts-row { grid-template-columns: 1fr; }
      .sidebar { width: 80px; padding: 16px 8px; }
      .brand-text, .nav-item span:nth-child(2), .nav-badge, .learner-card { display: none; }
    }

    /* WCAG AA Accessible Keyboard Focus & Skip Link */
    :focus-visible {
      outline: 2px solid var(--accent-cyan) !important;
      outline-offset: 2px !important;
    }
    .skip-to-content {
      position: absolute;
      top: -100px;
      left: 16px;
      background: var(--accent-cyan);
      color: #0A0E27;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 6px;
      z-index: 9999;
      transition: top 0.2s ease;
      text-decoration: none;
    }
    .skip-to-content:focus {
      top: 16px;
    }
  </style>
</head>
<body class="theme-dark">
  <a href="#root" class="skip-to-content">Skip to main content</a>
  <div id="root" role="main" aria-label="AI-Powered Personalized Learning Platform"></div>

  <script src="/static/app.bundle.js"></script>
</body>
</html>
